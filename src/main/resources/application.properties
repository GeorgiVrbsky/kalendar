spring.application.name=kalendar

spring.datasource.url=jdbc:mariadb://localhost:3306/kalendar?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
spring.datasource.username=kalendar_user
spring.datasource.password=kalendar_password
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# update tabulky po spusteni v databazi
spring.jpa.hibernate.ddl-auto=update

# DEBUG
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# MARIADB syntax
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect


# Jak dlouho si server pamatuje uzivatele bez cinnosti
server.servlet.session.timeout=1d

# Jak dlouho si prohlizec pamatuje cookie
server.servlet.session.cookie.max-age=1d


# Expose health and prometheus metrics endpoints
management.endpoints.web.exposure.include=health,prometheus

# Enable the prometheus endpoint explicitly
management.endpoint.prometheus.enabled=true

management.prometheus.metrics.export.enabled=true
